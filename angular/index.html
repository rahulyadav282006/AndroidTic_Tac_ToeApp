<!Doctype html>
<html>
    <head>
        <title>
            Angular JS  Form Validation
        </title>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>"
    
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;

        }
        h1{
            color:green;
        }
    </style>
    </head>
    <body ng-app="">
        <h1> SYCS full stack</h1>
        <h3>Angular JS Form Validation</h3>
        <form name="form1">
            <p>Name:<input name="username" ng-model="username" required>
            <span ng-show="form1.username.$pristine&&form1.username.$invalid">The name is required</span></p>
            <p>Address:<input name="useraddress" ng-model="useraddress" required></p>
        </form>
        <p>We use the ng showdirective to only  show the errror message<br>if the field has not modified yet AND content present in the field is in valid  </p>

    </body>

</html>
